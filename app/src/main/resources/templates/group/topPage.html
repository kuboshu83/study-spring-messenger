<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>グループトップページ</title>
</head>
<body>
<div><a th:href="@{/}">トップページ</a></div>
<div><a th:href="@{/groups/create}">新規グループ</a></div>

<h1>グループ一覧</h1>
<div th:each="group: ${groups}">
    <div>
        <a th:href="@{/groups/{id}(id=${group.id.value})}">
            名前: <span th:text="${group.name.value}">name</span>
            説明: <span th:text="${group.description.value}">description</span>
            ロック: <span th:text="${group.locked}">locked</span>
        </a>
    </div>
    <form method="post" th:action="@{/groups/{id}/delete(id=${group.id.value})}">
        <input type="submit" value="削除">
    </form>
</div>

</body>
</html>
