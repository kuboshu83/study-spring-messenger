<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>グループ詳細</title>
</head>
<body>

<div><a th:href="@{/groups}">グループトップページ</a></div>

<h1>グループ詳細</h1>
<form method="post" th:action="@{/groups/{id}/update(id=${group.id.value})}">
    <label for="name">名前:</label>
    <input id="name" name="name" type="text" th:value="${group.name.value}"/><br>

    <label for="description">説明:</label>
    <textarea id="description" name="description" th:text="${group.description.value}"></textarea><br>

    <label>ロック状況:</label>
    <input type="radio" id="locked-true" name="locked" value="true" th:checked="${group.locked}">
    <label for="locked-true">locked</label>
    <input type="radio" id="locked-false" name="locked" value="false" th:checked="${!group.locked}">
    <label for="locked-false">unlocked</label>

    <input type="submit" value="更新">
</form>
</body>
</html>
